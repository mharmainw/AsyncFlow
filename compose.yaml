services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - job_data:/data/jobs

  db:
    image: postgres:14.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  worker:
    build: . #to use your projects dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: [
      "celery",
      "-A",
      "app.celery_app:celery_app",
      "worker",
      "--loglevel=info",    # this whole commands starts a celery worker and loads the object from app/celery_app.py
    ]

    volumes:
      - job_data:/data/jobs

  integration-test:
    build: .
    profiles:
      - test
    env_file:
      - .env
    environment:
      ASYNCFLOW_API_URL: http://web:8000
    depends_on:
      web:
        condition: service_started
      worker:
        condition: service_started
    command:
      - sh
      - -c
      - alembic upgrade head && pytest tests/test_vertical_slice.py -q

volumes:
  postgres_data:

  job_data:
